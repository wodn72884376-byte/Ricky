# Netlify 빌드 설정.
#
# UI에만 두면 저장소를 다시 클론했을 때 사라진다. 여기 있어야 재현된다.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # postinstall이 Pretendard를 public/fonts로 복사한다. devDependencies가 필요하다.
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── 환경변수 ──
# 시크릿은 여기 적지 않는다. Netlify UI(Site configuration → Environment variables)에 넣는다.
#
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_SITE_URL
#   SUPABASE_SERVICE_ROLE_KEY     ← 서버 전용. 절대 NEXT_PUBLIC_ 붙이지 말 것
#   STRIPE_SECRET_KEY             ← 서버 전용
#   STRIPE_WEBHOOK_SECRET         ← 서버 전용
#
# 없어도 빌드는 통과한다(src/lib/env.ts가 지연 검증한다).
# 다만 로그인·주문조회·관리자는 동작하지 않는다.
